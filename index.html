<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .greeting-container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 90%;
        }
        h1 {
            color: #333;
        }
        .name-input {
            margin-top: 20px;
            padding: 10px;
        }
        input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 5px;
        }
        button {
            padding: 8px 15px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        .personal-greeting {
            margin-top: 15px;
            font-weight: bold;
            color: #4CAF50;
        }
    </style>
</head>
<body>
    <div class="greeting-container">
        <h1 id="time-greeting">Welcome!</h1>
        <p>We're glad to see you here.</p>
        
        <div class="name-input">
            <input type="text" id="name-field" placeholder="Enter your name">
            <button onclick="greetUser()">Greet Me</button>
        </div>
        
        <p id="personal-greeting" class="personal-greeting"></p>
    </div>

    <script>
        // Function to get time-based greeting
        function getTimeBasedGreeting() {
            const hour = new Date().getHours();
            let greeting;
            
            if (hour < 12) {
                greeting = "Good morning";
            } else if (hour < 18) {
                greeting = "Good afternoon";
            } else {
                greeting = "Good evening";
            }
            
            document.getElementById("time-greeting").textContent = greeting + "!";
        }
        
        // Function to greet the user by name
        function greetUser() {
            const name = document.getElementById("name-field").value.trim();
            const personalGreeting = document.getElementById("personal-greeting");
            
            if (name) {
                personalGreeting.textContent = `Welcome to our page, ${name}! We hope you enjoy your visit.`;
            } else {
                personalGreeting.textContent = "Please enter your name for a personalized greeting.";
            }
        }
        
        // Initialize the time-based greeting when the page loads
        window.onload = getTimeBasedGreeting;
    </script>
</body>
</html>
