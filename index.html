<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f5f5f5;
        }
        .greeting-container {
            text-align: center;
            padding: 2rem;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            width: 100%;
        }
        h1 {
            color: #333;
        }
        .game-container {
            margin-top: 2rem;
            padding-top: 1.5rem;
            border-top: 1px solid #eee;
        }
        .game-title {
            color: #4a4a4a;
            margin-bottom: 1rem;
        }
        .game-input {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }
        .game-input input {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            margin-right: 8px;
            width: 80px;
        }
        .game-input button {
            padding: 8px 16px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .game-input button:hover {
            background-color: #45a049;
        }
        .game-message {
            margin-top: 1rem;
            font-weight: bold;
            min-height: 24px;
        }
        .game-stats {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #666;
        }
        .correct {
            color: #4CAF50;
        }
        .wrong {
            color: #f44336;
        }
        .reset-button {
            margin-top: 1rem;
            padding: 8px 16px;
            background-color: #2196F3;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.3s;
            display: none;
        }
        .reset-button:hover {
            background-color: #0b7dda;
        }
    </style>
</head>
<body>
    <div class="greeting-container">
        <h1>Welcome!</h1>
        <p>We're glad to see you here.</p>
        
        <div class="game-container" id="game-container">
            <h2 class="game-title">Number Guessing Game</h2>
            <p>I'm thinking of a number between 1 and 100. Can you guess it?</p>
            
            <div class="game-input">
                <input type="number" id="guess-input" min="1" max="100" placeholder="1-100">
                <button id="guess-button">Guess</button>
            </div>
            
            <div class="game-message" id="game-message"></div>
            <div class="game-stats" id="game-stats">Attempts: 0</div>
            
            <button id="reset-button" class="reset-button">Play Again</button>
        </div>
    </div>

    <script>
        // Game logic
        document.addEventListener('DOMContentLoaded', function() {
            // Game elements
            const guessInput = document.getElementById('guess-input');
            const guessButton = document.getElementById('guess-button');
            const gameMessage = document.getElementById('game-message');
            const gameStats = document.getElementById('game-stats');
            const resetButton = document.getElementById('reset-button');
            
            // Game variables
            let targetNumber;
            let attempts;
            
            // Initialize the game
            function initGame() {
                targetNumber = Math.floor(Math.random() * 100) + 1;
                attempts = 0;
                gameStats.textContent = `Attempts: ${attempts}`;
                gameMessage.textContent = '';
                gameMessage.className = 'game-message';
                guessInput.value = '';
                guessInput.disabled = false;
                guessButton.disabled = false;
                resetButton.style.display = 'none';
                console.log('Game initialized. Target number:', targetNumber);
            }
            
            // Check the user's guess
            function checkGuess() {
                const userGuess = parseInt(guessInput.value);
                
                // Validate input
                if (isNaN(userGuess) || userGuess < 1 || userGuess > 100) {
                    gameMessage.textContent = 'Please enter a valid number between 1 and 100.';
                    gameMessage.className = 'game-message wrong';
                    return;
                }
                
                // Increment attempts
                attempts++;
                gameStats.textContent = `Attempts: ${attempts}`;
                
                // Check guess
                if (userGuess === targetNumber) {
                    gameMessage.textContent = `Congratulations! You guessed the number ${targetNumber} in ${attempts} attempts!`;
                    gameMessage.className = 'game-message correct';
                    guessInput.disabled = true;
                    guessButton.disabled = true;
                    resetButton.style.display = 'inline-block';
                } else if (userGuess < targetNumber) {
                    gameMessage.textContent = 'Too low! Try a higher number.';
                    gameMessage.className = 'game-message wrong';
                } else {
                    gameMessage.textContent = 'Too high! Try a lower number.';
                    gameMessage.className = 'game-message wrong';
                }
                
                // Clear input for next guess
                guessInput.value = '';
                guessInput.focus();
            }
            
            // Event listeners
            guessButton.addEventListener('click', checkGuess);
            guessInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    checkGuess();
                }
            });
            resetButton.addEventListener('click', initGame);
            
            // Start the game
            initGame();
        });
    </script>
</body>
</html>
